name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            7zip \
            desktop-file-utils \
            gettext \
            gir1.2-adw-1 \
            gir1.2-gtk-4.0 \
            ninja-build \
            python3-gi \
            python3-venv \
            xauth \
            xvfb

      - name: Install development dependencies
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e '.[dev]'
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Verify runtime dependencies
        run: |
          .venv/bin/python -c \
            'from nautilus_7zip.backend import resolve_sevenzip; print(resolve_sevenzip().display_name)'
          .venv/bin/python -c \
            'import gi; gi.require_version("Gtk", "4.0"); gi.require_version("Adw", "1"); from gi.repository import Adw, Gtk'

      - name: Validate release metadata
        run: |
          PROJECT_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$TAG_VERSION" != "$PROJECT_VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match project version $PROJECT_VERSION" >&2
            exit 1
          fi
          python3 tools/release_notes.py CHANGELOG.md "$PROJECT_VERSION" > release-notes.md
          echo "PROJECT_VERSION=$PROJECT_VERSION" >> "$GITHUB_ENV"

      - name: Lint
        run: ruff check .

      - name: Build
        run: |
          meson setup build --prefix=/usr
          meson compile -C build
          desktop-file-validate \
            build/io.github.michaelbrylevskii.Nautilus7Zip.desktop

      - name: Test
        env:
          GDK_BACKEND: x11
        run: xvfb-run -a meson test -C build --print-errorlogs

      - name: Stage installation
        run: DESTDIR="$RUNNER_TEMP/install-root" meson install -C build

      - name: Build source archive
        run: meson dist -C build --no-tests

      - name: Create checksum
        working-directory: build/meson-dist
        run: |
          sha256sum "nautilus-7zip-${PROJECT_VERSION}.tar.xz" \
            > "nautilus-7zip-${PROJECT_VERSION}.tar.xz.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/meson-dist/nautilus-7zip-${PROJECT_VERSION}.tar.xz" \
            "build/meson-dist/nautilus-7zip-${PROJECT_VERSION}.tar.xz.sha256" \
            --title "7-Zip for Nautilus ${PROJECT_VERSION}" \
            --notes-file release-notes.md \
            --verify-tag
