[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nautilus-7zip"
version = "0.1.0"
description = "A native Nautilus context menu and GTK interface for the 7-Zip command-line tool"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Nautilus 7-Zip contributors" }]
keywords = ["nautilus", "7zip", "7z", "gnome", "archive"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: GTK",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment :: File Managers",
    "Topic :: System :: Archiving :: Compression",
]

[project.optional-dependencies]
dev = [
    "meson>=1.3",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.11",
]

[project.scripts]
nautilus-7zip = "nautilus_7zip.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["nautilus_7zip*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=nautilus_7zip --cov-report=term-missing --cov-report=xml --cov-fail-under=85"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: exercises the installed 7z executable",
    "gtk: requires GTK 4 and libadwaita introspection data",
]

[tool.coverage.run]
branch = true
source = ["src/nautilus_7zip"]
omit = [
    "src/nautilus_7zip/application.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
